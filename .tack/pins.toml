# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
gh = "github:{path}"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
 nixpkgs = ["nixpkgs"]
 hjem = ["hjem"]
# nixpkgs = ["nixpkgs-stable", "nixpkgs-unstable"]

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file
[inputs]

[inputs.sops-nix]
url = "gh:Mic92/sops-nix"
exclude_follow = ["nixpkgs"]

[inputs.disko]
url = "gh:nix-community/disko"
exclude_follow = ["nixpkgs"]

[inputs.finix]
url = "gh:finix-community/finix"

[inputs.hjem]
url = "gh:feel-co/hjem"

[inputs.hjem-rum]
url = "gh:snugnug/hjem-rum"

[inputs.deploy-rs]
url = "gh:serokell/deploy-rs"

[inputs.hardware]
url = "gh:NixOS/nixos-hardware"

[inputs.nixarr]
url = "gh:rasmus-kirk/nixarr"

[inputs.impermanence]
url = "gh:nix-community/impermanence"
exclude_follow = ["nixpkgs"]

[inputs.nix-index-database]
url = "gh:nix-community/nix-index-database"
exclude_follow = ["nixpkgs"]

[inputs.authentik-nix]
url = "gh:nix-community/authentik-nix"
exclude_follow = ["nixpkgs"]

[inputs.nix-cachyos-kernel]
url = "gh:xddxdd/nix-cachyos-kernel"
exclude_follow = ["nixpkgs"]

[inputs.niri-nix]
url = "git+https://codeberg.org/BANanaD3V/niri-nix"
exclude_follow = ["nixpkgs"]

[inputs.hyprland]
url = "gh:hyprwm/Hyprland"
submodules = true

[inputs.mango]
url = "gh:mangowm/mango"
exclude_follow = ["nixpkgs"]

[inputs.noctalia]
url = "gh:noctalia-dev/noctalia/cachix"
exclude_follow = ["nixpkgs"]

[inputs.systems]
url = "gh:nix-systems/default-linux"

[inputs.community-modules]
url = "gh:finix-community/community-modules"

[inputs.nixpkgs]
url = "github:NixOS/nixpkgs"

[inputs.halley]
url = "gh:N1meses/halley/feat/flake"

[inputs.glide]
url = "gh:glide-browser/glide.nix"

[inputs.umbriel]
# tarball fetcher cannot get the scenefx submodule; nix/package.nix throws on it
url = "git+https://github.com/noctalia-dev/umbriel"
submodules = true
