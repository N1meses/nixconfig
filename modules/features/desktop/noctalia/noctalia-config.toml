[audio]
enable_overdrive = false
enable_sounds = false
notification_sound = ""
sound_volume = 0.20000000000000001
volume_change_sound = ""

[backdrop]
blur_intensity = 0.5
enabled = false
tint_intensity = 0.29999999999999999

[bar]
order = [ "default" ]

    [bar.default]
    auto_hide = false
    background_opacity = 0.95555500000000004
    border = "surface"
    border_width = 0.0
    capsule = true
    capsule_fill = "surface_variant"
    capsule_opacity = 1.0
    capsule_padding = 1.0
    center = [ "media" ]
    contact_shadow = false
    enabled = true
    end = [ "wallpaper", "group:g1", "battery", "output_volume", "bluetooth", "network", "clock", "session" ]
    font_weight = 500
    margin_edge = 8
    margin_ends = 8
    padding = 8
    panel_overlap = 1
    position = "left"
    radius = 16
    radius_bottom_left = 16
    radius_bottom_right = 16
    radius_top_left = 16
    radius_top_right = 16
    reserve_space = true
    scale = 1.0
    shadow = false
    start = [ "control-center", "tray", "taskbar" ]
    thickness = 35
    widget_spacing = 4

        [[bar.default.capsule_group]]
        fill = "surface_variant"
        id = "g1"
        members = [ "sysmon", "cpu", "ram" ]
        opacity = 1.0
        padding = 6.0

[brightness]
enable_ddcutil = false
ignore_mmids = []

[control_center]
sidebar = "compact"
sidebar_section = "compact"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

[desktop_widgets]
enabled = true
schema_version = 1
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = false
active_opacity = 1.0
active_scale = 1.0
auto_hide = false
background_opacity = 0.68999999999999995
enabled = false
icon_size = 48
inactive_opacity = 0.84999999999999998
inactive_scale = 0.84999999999999998
item_spacing = 6
launcher_icon = "grid-dots"
launcher_position = "none"
margin_edge = 8
margin_ends = 0
monitors = []
padding = 8
pinned = []
position = "bottom"
radius = 16
radius_bottom_left = 16
radius_bottom_right = 16
radius_top_left = 16
radius_top_right = 16
reserve_space = false
shadow = true
show_dots = false
show_instance_count = true
show_running = true

[general]
avatarImage = "/nix/store/8b0g2sz20bvx4djiqnq2cf9pzwlzvph2-source/assets/icons/hunter.jpeg"

[hooks]
battery_low_percent_threshold = 0
battery_state_changed = []
battery_under_threshold = []
bluetooth_disabled = []
bluetooth_enabled = []
colors_changed = []
logging_out = []
power_profile_changed = []
rebooting = []
session_locked = []
session_unlocked = []
shutting_down = []
started = []
theme_mode_changed = []
wallpaper_changed = []
wifi_disabled = []
wifi_enabled = []

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 2.0

    [idle.behavior.lock]
    action = "lock"
    command = ""
    enabled = true
    resume_command = ""
    timeout = 600

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    command = ""
    enabled = false
    resume_command = ""
    timeout = 900

    [idle.behavior.screen-off]
    action = "screen_off"
    command = ""
    enabled = false
    resume_command = ""
    timeout = 660

[keybinds]
cancel = [ "Escape" ]
down = [ "Down" ]
left = [ "Left" ]
right = [ "Right" ]
up = [ "Up" ]
validate = [ "Return", "KP_Enter" ]

[lockscreen]
blur_intensity = 0.79999998211860657
blurred_desktop = false
tint_intensity = 0.4999999888241291

[nightlight]
enabled = false
force = false
start_time = ""
stop_time = ""
temperature_day = 6500
temperature_night = 4000
use_weather_location = true

[notification]
background_opacity = 0.68999999999999995
collapse_on_dismiss = true
enable_daemon = true
layer = "top"
monitors = []
offset_x = 20
offset_y = 8
position = "top_right"
scale = 1.0

[osd]
background_opacity = 0.96999999999999997
keyboard_layout = true
lock_keys = true
monitors = []
offset_x = 20
offset_y = 8
orientation = "horizontal"
position = "top_right"
scale = 1.0

[shell]
avatar_path = "/home/nimeses/nixconfig/assets/icons/hunter.jpeg"
clipboard_auto_paste = "auto"
clipboard_confirm_clear_history = true
clipboard_enabled = true
clipboard_history_max_entries = 50
clipboard_image_action_command = ""
corner_radius_scale = 0.94999999999999996
date_format = "%A, %x"
disable_mipmaps = false
font_family = "IBM Plex Mono"
launch_apps_as_systemd_services = false
middle_click_opens_widget_settings = true
niri_overview_type_to_launch_enabled = true
offline_mode = false
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
shared_gl_context = true
show_location = true
telemetry_enabled = true
time_format = "{:%H:%M}"
ui_scale = 1.0

    [shell.animation]
    enabled = true
    speed = 1.5

    [shell.mpris]
    blacklist = []

    [shell.panel]
    background_blur = true
    borders = true
    clipboard_placement = "centered"
    control_center_placement = "floating"
    launcher_categories = true
    launcher_compact = false
    launcher_placement = "centered"
    launcher_show_icons = true
    open_near_click_clipboard = false
    open_near_click_control_center = true
    open_near_click_launcher = false
    open_near_click_session = false
    open_near_click_wallpaper = false
    session_placement = "centered"
    shadow = false
    transparency_mode = "solid"
    wallpaper_placement = "attached"

    [shell.screen_corners]
    enabled = true
    size = 32

    [shell.screenshot]
    directory = "/home/nimeses/Pictures/Screenshots"

    [[shell.session.actions]]
    action = "lock"
    command = ""
    enabled = true
    glyph = ""
    label = ""
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    command = ""
    enabled = true
    glyph = ""
    label = ""
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    command = ""
    enabled = true
    glyph = ""
    label = ""
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    command = ""
    enabled = true
    glyph = ""
    label = ""
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    command = ""
    enabled = true
    glyph = ""
    label = ""
    shortcut = "5"
    variant = "destructive"

    [shell.shadow]
    alpha = 0.55000000000000004
    direction = "down"

[system.monitor]
cpu_poll_seconds = 2.0
disk_poll_seconds = 10.0
enabled = true
gpu_poll_seconds = 5.0
memory_poll_seconds = 2.0
network_poll_seconds = 3.0

[theme]
builtin = "m3-rainbow"
community_palette = ""
custom_palette = ""
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "ghostty", "qt" ]
    community_ids = [ "obsidian", "vicinae", "discord", "steam" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
directory = "/home/nimeses/Pictures/Wallpapers"
directory_dark = ""
directory_light = ""
edge_smoothness = 0.29999999999999999
enabled = true
fill_color = ""
fill_mode = "crop"
per_monitor_directories = false
transition = [ "fade", "wipe", "disc", "stripes", "zoom", "honeycomb" ]
transition_duration = 500
transition_on_startup = false

    [wallpaper.automation]
    enabled = false
    interval_minutes = 10
    order = "random"
    recursive = false

    [wallpaper.default]
    path = "/home/nimeses/Pictures/Wallpapers/wallhaven_y85yld.jpg"

    [wallpaper.last]
    path = "/home/nimeses/Pictures/Wallpapers/wallhaven_y85yld.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/nimeses/Pictures/Wallpapers/wallhaven_y85yld.jpg"

[weather]
address = ""
auto_locate = false
effects = true
enabled = false
refresh_minutes = 30
unit = "metric"

[widget.active_window]
icon_size = 14.0
max_length = 260.0
min_length = 80.0
title_scroll = "none"
type = "active_window"

[widget.battery]
show_label = false

[widget.clock]
type = "clock"

[widget.control-center]
custom_image = "/home/nimeses/nixconfig/assets/icons/nixos.png"
scale = 1.5

[widget.cpu]
scale = 0.90000000000000002
show_label = false
stat = "cpu_temp"
type = "sysmon"

[widget.date]
format = "{:%a %d %b}"
type = "clock"

[widget.media]
art_size = 16.0
hide_when_no_media = true
max_length = 220.0
min_length = 80.0
title_scroll = "none"
type = "media"

[widget.network]
show_label = false

[widget.network_rx]
stat = "net_rx"
type = "sysmon"

[widget.network_tx]
stat = "net_tx"
type = "sysmon"

[widget.output_volume]
device = "output"
show_label = false
type = "volume"

[widget.ram]
label_min_width = 1.0
scale = 0.90000000000000002
show_label = false
stat = "ram_used"
type = "sysmon"

[widget.spacer]
type = "spacer"

[widget.sysmon]
show_label = false

[widget.taskbar]
group_by_workspace = true
hide_empty_workspaces = true
scale = 1.1000000000000001
type = "taskbar"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"
